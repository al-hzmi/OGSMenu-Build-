name: Build OGSMenu
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          if [ -f "OGSMenu/ModMenu.mm" ]; then
            SRC="OGSMenu/ModMenu.mm"
          else
            SRC="ModMenu.mm"
          fi
          clang++ -arch arm64 -dynamiclib -isysroot "$SDK" \
            -miphoneos-version-min=13.0 -fobjc-arc -Wno-deprecated-declarations \
            -framework UIKit -framework Foundation -framework QuartzCore -framework CoreGraphics \
            "$SRC" -o OGSMenu.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: OGSMenu_Dylib
          path: OGSMenu.dylib
