name: Build OGSMenu dylib
on:
  push:
    paths:
      - 'OGSMenu/**'
      - '.github/workflows/build-dylib.yml'
      - 'tests/**'
      - 'tools/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    # OGS51: ARM pool stayed unassigned >14 minutes; standard Intel pool
    # cross-compiles the same arm64-apple-ios14.0 target with the same command.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Record run ID for artifact retrieval
        if: github.run_attempt == 1 && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s %s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > .ogs-latest-build-run
          git add .ogs-latest-build-run
          git diff --cached --quiet || (git commit -m "chore: record build run [skip ci]" && git push origin HEAD:main)
      - name: Prepare Dobby iOS ARM64 dependency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/dobby
          curl --fail --location --retry 3 \
            "https://github.com/jmpews/Dobby/releases/download/latest/dobby-iphoneos-all.tar.gz" \
            -o /tmp/dobby-iphoneos-all.tar.gz
          tar -xzf /tmp/dobby-iphoneos-all.tar.gz -C vendor/dobby
          test -f vendor/dobby/build/iphoneos/dobby.h
          test -f vendor/dobby/build/iphoneos/arm64/libdobby.a
          xcrun lipo -info vendor/dobby/build/iphoneos/arm64/libdobby.a
      - name: Test explosion protection policy
        run: clang++ -std=c++17 -Wall -Wextra -pedantic tests/test_shield_policy.cpp -o /tmp/ogs-shield-policy && /tmp/ogs-shield-policy
      - name: Test gameplay lifecycle policy
        run: clang++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/test_gameplay_policy.cpp -o /tmp/ogs-gameplay-policy && /tmp/ogs-gameplay-policy
      - name: Test remote team request lifecycle
        run: clang++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/test_remote_team_policy.cpp -o /tmp/ogs-remote-team && /tmp/ogs-remote-team
      - name: Test original-client team-change guard
        run: clang++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/test_original_client_team_policy.cpp -o /tmp/ogs-original-team && /tmp/ogs-original-team
      - name: Test training input bounds and stale markers
        run: clang++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/test_ogs51_training.cpp -o /tmp/ogs51-training && /tmp/ogs51-training
      - name: Check compact OGS54 play-menu layout
        run: python3 tools/test_ogs54_ui.py
      - name: Test bounded defensive policies
        run: clang++ -std=c++17 -Wall -Wextra -Werror -pedantic -pthread tests/test_ogs55_defensive.cpp -o /tmp/ogs55-defense && /tmp/ogs55-defense
      - name: Compile iOS arm64 dylib
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p dist
          xcrun --sdk iphoneos clang++ -target arm64-apple-ios14.0 -isysroot "$SDK" -std=c++17 -fobjc-arc -fblocks -dynamiclib -Ivendor/dobby/build/iphoneos -framework UIKit -framework Foundation -framework QuartzCore -framework CoreGraphics -Wl,-install_name,@rpath/OGSMenu.dylib OGSMenu/ModMenu.mm vendor/dobby/build/iphoneos/arm64/libdobby.a -lc++ -o dist/OGSMenu.dylib
          # The game links @rpath/OGSMenu.dylib internally. Ship the same
          # bytes under an explicit release name for unambiguous downloads.
          # Research build only: no IPA or release is produced.
          file dist/OGSMenu.dylib
          shasum -a 256 dist/OGSMenu.dylib
          xcrun vtool -show-build dist/OGSMenu.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: OGSMenu-ios-arm64-dylib
          path: dist/OGSMenu.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: OGSMenu-Stage12-Source-Review
          path: OGSMenu/ModMenu.mm
