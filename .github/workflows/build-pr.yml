name: Build OGSMenu dylib
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile arm64 iOS library
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p dist
          xcrun --sdk iphoneos clang++ -target arm64-apple-ios14.0 -isysroot "$SDK" -std=c++17 -fobjc-arc -fblocks -dynamiclib -framework UIKit -framework Foundation -framework QuartzCore -framework CoreGraphics -Wl,-install_name,@rpath/OGSMenu.dylib OGSMenu/ModMenu.mm -o dist/OGSMenu.dylib
          file dist/OGSMenu.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: OGSMenu-ios-arm64-dylib
          path: dist/OGSMenu.dylib
